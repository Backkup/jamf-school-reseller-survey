<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Collecte en cours</title>
<style>
  :root { --bg:#ffffff; --surface:#f7f6f3; --text:#37352f; --muted:#8c887f; --faint:#b4b0a8; --border:#e8e7e2; --accent:#c96442; --green:#4a8a5d; --amber:#c79a3a; --red:#b3543f; --purple:#7a6bb0; --track:#e6e4dd; --scroll:#dcdad3; }
  body.dark { --bg:#1f1e1c; --surface:#292826; --text:#ece9e2; --muted:#9a958b; --faint:#6c685f; --border:#393730; --accent:#d97757; --green:#6aa87d; --amber:#d3ab52; --red:#d08367; --purple:#9586c4; --track:#393730; --scroll:#4a463f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

  .header { padding: 16px 20px 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .header h1 { font-size: 15px; font-weight: 600; }
  .header .subtitle { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .progress-bar-wrap { padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .progress-bar-bg { background: var(--track); border-radius: 6px; height: 7px; overflow: hidden; }
  .progress-bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.4s ease; border-radius: 6px; }
  .progress-label { font-size: 11px; color: var(--muted); margin-top: 6px; }

  .log-area { flex: 1; overflow-y: auto; padding: 12px 20px; display: flex; flex-direction: column; gap: 6px; }
  .log-area::-webkit-scrollbar { width: 10px; }
  .log-area::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 6px; border: 2px solid var(--bg); }

  .log-entry { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; padding: 8px 12px; border-radius: 7px; background: var(--surface); border-left: 3px solid transparent; }
  .log-entry.info { border-left-color: var(--faint); }
  .log-entry.success { border-left-color: var(--green); }
  .log-entry.warning { border-left-color: var(--amber); }
  .log-entry.error { border-left-color: var(--red); }
  .log-entry.notification { border-left-color: var(--purple); }

  .log-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .log-text { flex: 1; line-height: 1.5; }
  .log-text strong { color: var(--text); font-weight: 600; }
  .log-time { font-size: 11px; color: var(--faint); flex-shrink: 0; }

  .status-bar { padding: 10px 20px; background: var(--surface); border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); display: inline-block; margin-right: 6px; animation: pulse 1s infinite; }
  .status-dot.done { background: var(--green); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>
<div class="header">
  <h1>Collecte en cours</h1>
  <div class="subtitle" id="subtitle">Initialisation...</div>
</div>

<div class="progress-bar-wrap">
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 / 0 instances traitées</div>
</div>

<div class="log-area" id="logArea"></div>

<div class="status-bar">
  <span><span class="status-dot" id="statusDot"></span><span id="statusText">En cours...</span></span>
  <span id="statsText"></span>
</div>

<script>
// window.api exposé via preload.js

(function applyTheme() {
  let t = localStorage.getItem('theme');
  if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.body.classList.toggle('dark', t === 'dark');
})();

let total = 0;
let processed = 0;
let stats = { ok: 0, warning: 0, error: 0 };

function now() {
  return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function addLog(icon, type, html) {
  const area = document.getElementById('logArea');
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  entry.innerHTML = `<span class="log-icon">${icon}</span><span class="log-text">${html}</span><span class="log-time">${now()}</span>`;
  area.appendChild(entry);
  area.scrollTop = area.scrollHeight;
}

function updateProgress() {
  const pct = total > 0 ? Math.round((processed / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${processed} / ${total} instances traitées`;
}

window.api.onProgress((event) => {
  switch (event.type) {
    case 'start':
      total = event.total;
      document.getElementById('subtitle').textContent = `${total} instances · ${event.masters || 1} maître(s)`;
      updateProgress();
      addLog('🚀', 'info', `Collecte démarrée — <strong>${total} instances</strong> sur ${event.masters || 1} maître(s)`);
      break;

    case 'log':
      addLog('ℹ️', 'info', event.message);
      break;

    case 'instance':
      document.getElementById('subtitle').textContent = `${event.master ? event.master + ' · ' : ''}${event.prefix}`;
      addLog('🔍', 'info', `Analyse de <strong>${event.prefix}</strong>${event.master ? ` <span style="color:#5a7a9e">(${event.master})</span>` : ''}...`);
      break;

    case 'status':
      addLog('🚨', 'error', `<strong>${event.prefix}</strong> — ${event.message}`);
      break;

    case 'result': {
      const r = event.result;
      const fmt = (iso) => new Date(iso).toLocaleDateString('fr-FR');
      const bits = [];
      if (r.apns) bits.push(`APNs ${fmt(r.apns.date)} (J-${r.apns.daysLeft})`);
      if (r.vpp && r.vpp.expired) bits.push('VPP expiré');
      else if (r.vpp) bits.push(`VPP ${fmt(r.vpp.date)} (J-${r.vpp.daysLeft})`);
      if (r.dep && r.dep.cgu) bits.push('CGU Apple');
      else if (r.dep) bits.push(`DEP ${fmt(r.dep.date)}`);
      if (r.locked) bits.push('VERROUILLÉE');
      if (r.notifications && r.notifications.length) bits.push(`${r.notifications.length} notif.`);
      const detail = bits.join(' · ') || (r.error || '—');

      const map = {
        CRITIQUE:     ['🔴', 'error',        () => stats.error++],
        URGENT:       ['🟠', 'warning',      () => stats.warning++],
        ATTENTION:    ['⚠️', 'warning',      () => stats.warning++],
        LICENCE:      ['🔵', 'notification', () => stats.warning++],
        INACCESSIBLE: ['❌', 'error',        () => stats.error++],
        OK:           ['✅', 'success',      () => stats.ok++],
      };
      const [icon, type, bump] = map[r.level] || map.OK;
      bump();
      processed++;
      updateProgress();
      addLog(icon, type, `<strong>${r.prefix}</strong> — ${detail}`);
      updateStats();
      break;
    }

    case 'error':
      stats.error++;
      addLog('❌', 'error', `<strong>${event.prefix}</strong> — Erreur : ${event.message}`);
      updateStats();
      break;
  }
});

window.api.onDone((result) => {
  document.getElementById('statusDot').classList.add('done');
  document.getElementById('statusText').textContent = 'Audit terminé';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = `${total} / ${total} instances traitées`;

  if (result.success) {
    const reports = result.reports || [];
    document.getElementById('subtitle').textContent =
      result.mode === 'slack' ? `${reports.length} rapport(s) publié(s) sur Slack` : `${reports.length} rapport(s) PDF généré(s)`;
    addLog('✅', 'success', `<strong>Audit terminé</strong> — ${total} instance(s) sur ${reports.length} maître(s)`);
    reports.forEach(r => {
      if (r.delivered === 'slack') {
        addLog('📤', 'success', `<strong>${r.master}</strong> — publié sur Slack (copie : ${r.pdfPath})`);
      } else {
        addLog('📄', 'success', `<strong>${r.master}</strong> — ${r.pdfPath}`);
      }
    });
  } else {
    document.getElementById('subtitle').textContent = 'Échec';
    addLog('❌', 'error', `Erreur critique : ${result.error}`);
  }
  updateStats();
});

function updateStats() {
  document.getElementById('statsText').textContent =
    `✅ ${stats.ok}  ⚠️ ${stats.warning}  ❌ ${stats.error}`;
}
</script>
</body>
</html>
